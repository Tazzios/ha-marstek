
blueprint:
  name: Energieverdeling zonnepanelen en batterij
  description: >
    Berekent de energiestromen actueel met kw sensors of in kWh (voor bijvoorbeeld verdere prijs calculatie).
    De resultaten worden opgeslagen in aan te maken helpers.
  domain: automation

  input:

    input_sensors:
      name: Invoersensoren
      icon: mdi:transmission-tower-import
      description: Selecteer de sensoren voor de energieberekening.
      collapsed: false
      input:

        solar_sensors:
          name: Zonneproductie
          description: Selecteer één of meerdere sensoren.
          default: []
          selector:
            entity:
              domain: sensor
              multiple: true

        grid_sensor:
          name: Netenergie
          description: Positief = import, negatief = export.
          selector:
            entity:
              domain: sensor

        battery_charge_sensors:
          name: Batterij laden
          description: Selecteer één of meerdere sensoren.
          default: []
          selector:
            entity:
              domain: sensor
              multiple: true

        battery_discharge_sensors:
          name: Batterij ontladen
          description: Selecteer één of meerdere sensoren.
          default: []
          selector:
            entity:
              domain: sensor
              multiple: true

    output_sensors:
      name: Uitvoersensoren
      icon: mdi:transmission-tower-export
      description: Selecteer de helpers waarin de resultaten worden opgeslagen.
      collapsed: false
      input:

        output_precision:
          name: Aantal decimalen
          description: Bepaal de afronding van de uitvoerwaarden.
          default: 3
          selector:
            number:
              min: 0
              max: 6
              step: 1
              mode: slider
#        output_house:
#          name: Huisverbruik
#          default: null
#          selector:
#            entity:
#              domain: sensor

        output_solar_home:
          name: Zon naar huis
          default: null
          selector:
            entity:
              domain: sensor

        output_solar_battery:
          name: Zon naar batterij
          default: null
          selector:
            entity:
              domain: sensor

        output_solar_grid:
          name: Zon naar grid
          default: null
          selector:
            entity:
              domain: sensor

        output_grid_home:
          name: Grid naar huis
          default: null
          selector:
            entity:
              domain: sensor

        output_grid_battery:
          name: Grid naar batterij
          default: null
          selector:
            entity:
              domain: sensor

        output_battery_home:
          name: Batterij naar huis
          default: null
          selector:
            entity:
              domain: sensor

        output_battery_grid:
          name: Batterij naar grid
          default: null
          selector:
            entity:
              domain: sensor

trigger:
  - platform: state
    entity_id: !input solar_sensors

  - platform: state
    entity_id: !input grid_sensor

  - platform: state
    entity_id: !input battery_charge_sensors

  - platform: state
    entity_id: !input battery_discharge_sensors

  - platform: time_pattern
    minutes: "/15"

  - platform: homeassistant
    event: start

variables:
  solar_sensors: !input solar_sensors
  grid_sensor: !input grid_sensor
  battery_charge_sensors: !input battery_charge_sensors
  battery_discharge_sensors: !input battery_discharge_sensors

  output_precision: !input output_precision

  solar_production: >
    {% set ns = namespace(total=0) %}
    {% for s in expand(solar_sensors) %}
      {% set value = s.state | float(0) %}
      {% if s.attributes.unit_of_measurement == 'kW' %}
        {% set ns.total = ns.total + value * 1000 %}
      {% else %}
        {% set ns.total = ns.total + value %}
      {% endif %}
    {% endfor %}
    {{ ns.total }}

  grid_power: >
    {% set value = states(grid_sensor) | float(0) %}
    {% if state_attr(grid_sensor, 'unit_of_measurement') == 'kW' %}
      {{ value * 1000 }}
    {% else %}
      {{ value }}
    {% endif %}

  battery_charge: >
    {% set ns = namespace(total=0) %}
    {% for s in expand(battery_charge_sensors) %}
      {% set value = s.state | float(0) %}
      {% if s.attributes.unit_of_measurement == 'kW' %}
        {% set ns.total = ns.total + value * 1000 %}
      {% else %}
        {% set ns.total = ns.total + value %}
      {% endif %}
    {% endfor %}
    {{ ns.total }}

  battery_discharge: >
    {% set ns = namespace(total=0) %}
    {% for s in expand(battery_discharge_sensors) %}
      {% set value = s.state | float(0) %}
      {% if s.attributes.unit_of_measurement == 'kW' %}
        {% set ns.total = ns.total + value * 1000 %}
      {% else %}
        {% set ns.total = ns.total + value %}
      {% endif %}
    {% endfor %}
    {{ ns.total }}


  # start calculation
  grid_import: "{{ max(grid_power, 0) }}"
  grid_export: "{{ max(-grid_power, 0) }}"

  house_consumption: >
    {{ max(solar_production + battery_discharge
    + grid_import - battery_charge - grid_export, 0) }}

  solar_to_home: >
    {{ min(solar_production, house_consumption) }}

  solar_surplus: >
    {{ max(solar_production - solar_to_home, 0) }}

  solar_to_battery: >
    {{ min(battery_charge, solar_surplus) }}

  solar_to_grid: >
    {{ max(solar_surplus - solar_to_battery, 0) }}

  battery_to_grid: >
    {{ min(battery_discharge, grid_export) }}

  battery_to_home: >
    {{ min(max(battery_discharge - battery_to_grid, 0),
    max(house_consumption - solar_to_home, 0)) }}

  grid_to_battery: >
    {{ max(battery_charge - solar_to_battery, 0) }}

  grid_to_home: >
    {{ max(house_consumption - solar_to_home - battery_to_home, 0) }}


# Set values
action:
#  - if:
#      - condition: template
#        value_template: "{{ output_house != none and output_house != '' }}"
#    then:
#      - service: input_number.set_value
#        target:
#          entity_id: !input output_house
#        data:
#          value: "{{ house_consumption | round(3) }}"

  - if:
      - condition: template
        value_template: "{{ output_solar_home != none and output_solar_home != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_solar_home
        data:
          value: "{{ solar_to_home | round(output_precision) }}"

  - if:
      - condition: template
        value_template: "{{ output_solar_battery != none and output_solar_battery != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_solar_battery
        data:
          value: "{{ solar_to_battery | round(output_precision) }}"

  - if:
      - condition: template
        value_template: "{{ output_solar_grid != none and output_solar_grid != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_solar_grid
        data:
          value: "{{ solar_to_grid | round(output_precision) }}"

  - if:
      - condition: template
        value_template: "{{ output_grid_home != none and output_grid_home != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_grid_home
        data:
          value: "{{ grid_to_home | round(output_precision) }}"

  - if:
      - condition: template
        value_template: "{{ output_grid_battery != none and output_grid_battery != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_grid_battery
        data:
          value: "{{ grid_to_battery | round(output_precision) }}"

  - if:
      - condition: template
        value_template: "{{ output_battery_home != none and output_battery_home != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_battery_home
        data:
          value: "{{ battery_to_home | round(output_precision) }}"

  - if:
      - condition: template
        value_template: "{{ output_battery_grid != none and output_battery_grid != '' }}"
    then:
      - service: input_number.set_value
        target:
          entity_id: !input output_battery_grid
        data:
          value: "{{ battery_to_grid | round(output_precision) }}"


mode: restart
